# 一次性跨平台兼容性检查（不是门禁）：Ubuntu + Windows × Node 18 / 22
name: self-test
on:
  push:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  self-test:
    name: ${{ matrix.os }} / node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: ['18', '22']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Environment
        shell: bash
        run: |
          node --version
          git --version
          git config --show-origin --get core.autocrlf || true
      - name: Self-test
        run: node scripts/self-test.mjs
      - name: Quality smoke (real npx, one-time cross-platform check)
        shell: bash
        run: |
          node scripts/pd.mjs quality examples/minimal-workspace --no-record --mutation --test-cmd "node test/run-all.js"
          node -e "const s=JSON.parse(require('fs').readFileSync('examples/minimal-workspace/.metrics/pd-quality-latest.json','utf8'));const g=s.signals;for(const k of Object.keys(g))console.log(k,g[k].status,g[k].tool||'',g[k].reason||'');if(g.crap.status!=='OK'||g.duplication.status!=='OK')process.exit(1)"
      - name: Bash installer (Ubuntu)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          dest="$RUNNER_TEMP/pd-skills-sh"
          bash scripts/install.sh both --dir "$dest"
          test -f "$dest/product-development/SKILL.md"
          test ! -e "$dest/product-development/examples"
          bash scripts/install.sh --dir "$dest" --force
          ls "$dest"
          HOME="$RUNNER_TEMP/pd-home" bash scripts/install.sh both
          test -f "$RUNNER_TEMP/pd-home/.claude/skills/product-development/scripts/pd.mjs"
          test -f "$RUNNER_TEMP/pd-home/.agents/skills/product-development/scripts/pd.mjs"
          # /pds：both → Claude commands + Codex prompts；all 追加 Cursor commands
          cmp templates/commands/pds.md "$RUNNER_TEMP/pd-home/.claude/commands/pds.md"
          cmp templates/commands/pds.md "$RUNNER_TEMP/pd-home/.codex/prompts/pds.md"
          test ! -e "$RUNNER_TEMP/pd-home/.cursor/commands/pds.md"
          HOME="$RUNNER_TEMP/pd-home" bash scripts/install.sh all
          cmp templates/commands/cursor/pds.md "$RUNNER_TEMP/pd-home/.cursor/commands/pds.md"
          echo custom > "$RUNNER_TEMP/pd-home/.claude/commands/pds.md"
          HOME="$RUNNER_TEMP/pd-home" bash scripts/install.sh claude --force
          cmp templates/commands/pds.md "$RUNNER_TEMP/pd-home/.claude/commands/pds.md"
          ls "$RUNNER_TEMP/pd-home/.claude/commands/" | grep -q '^pds\.md\.bak\.'
          bash scripts/install.sh claude --dir "$RUNNER_TEMP/proj/.claude/skills" --commands-dir "$RUNNER_TEMP/proj/.claude/commands"
          cmp templates/commands/pds.md "$RUNNER_TEMP/proj/.claude/commands/pds.md"
          node "$dest/product-development/scripts/pd.mjs" skills "$RUNNER_TEMP"
      - name: PowerShell installer (Windows PowerShell 5.1)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $dest = Join-Path $env:RUNNER_TEMP 'pd-skills-ps'
          .\scripts\install.ps1 -Target Both -Dir $dest
          if (-not (Test-Path (Join-Path $dest 'product-development\SKILL.md'))) { throw 'SKILL.md missing' }
          if (Test-Path (Join-Path $dest 'product-development\examples')) { throw 'examples should not be installed' }
          .\scripts\install.ps1 -Dir $dest -Force
          $env:USERPROFILE = Join-Path $env:RUNNER_TEMP 'pd-home'
          New-Item -ItemType Directory -Force $env:USERPROFILE | Out-Null
          .\scripts\install-user.ps1 -Target Both
          foreach ($b in '.claude', '.agents') {
            $f = Join-Path $env:USERPROFILE "$b\skills\product-development\scripts\pd.mjs"
            if (-not (Test-Path $f)) { throw "missing $f" }
          }
          # /pds：Both → Claude commands + Codex prompts（内容与模板一致）；All 追加 Cursor
          $std = (Get-FileHash 'templates\commands\pds.md').Hash
          foreach ($c in '.claude\commands\pds.md', '.codex\prompts\pds.md') {
            $f = Join-Path $env:USERPROFILE $c
            if (-not (Test-Path $f)) { throw "missing $f" }
            if ((Get-FileHash $f).Hash -ne $std) { throw "content mismatch $f" }
          }
          .\scripts\install.ps1 -Target All
          $cf = Join-Path $env:USERPROFILE '.cursor\commands\pds.md'
          if ((Get-FileHash $cf).Hash -ne (Get-FileHash 'templates\commands\cursor\pds.md').Hash) { throw 'cursor pds.md missing or mismatch' }
          Set-Content -Path (Join-Path $env:USERPROFILE '.codex\prompts\pds.md') -Value 'custom'
          .\scripts\install.ps1 -Target Codex
          if ((Get-Content (Join-Path $env:USERPROFILE '.codex\prompts\pds.md') -Raw).Trim() -ne 'custom') { throw 'overwrote custom pds.md without -Force' }
          .\scripts\install.ps1 -Target Codex -Force
          if ((Get-FileHash (Join-Path $env:USERPROFILE '.codex\prompts\pds.md')).Hash -ne $std) { throw '-Force did not update pds.md' }
          if (-not (Get-ChildItem (Join-Path $env:USERPROFILE '.codex\prompts') -Filter 'pds.md.bak.*')) { throw 'no backup of custom pds.md' }
          node (Join-Path $dest 'product-development\scripts\pd.mjs') skills $env:RUNNER_TEMP
          if ($LASTEXITCODE -ne 0) { throw "pd.mjs skills exit $LASTEXITCODE" }
      - name: PowerShell 7 + cmd shim (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $dest = Join-Path $env:RUNNER_TEMP 'pd-skills-pwsh'
          ./scripts/install.ps1 Codex -Dir $dest
          if (-not (Test-Path (Join-Path $dest 'product-development/scripts/pd.mjs'))) { throw 'pwsh install failed' }
          cmd /c "scripts\install.cmd both --dir `"$env:RUNNER_TEMP\pd-skills-cmd`""
          if ($LASTEXITCODE -ne 0) { throw "install.cmd exit $LASTEXITCODE" }
          if (-not (Test-Path (Join-Path $env:RUNNER_TEMP 'pd-skills-cmd/product-development/SKILL.md'))) { throw 'cmd shim install failed' }
          cmd /c "scripts\install.cmd cursor --dir `"$env:RUNNER_TEMP\pd-cmd2\skills`" --commands-dir `"$env:RUNNER_TEMP\pd-cmd2\commands`""
          if ($LASTEXITCODE -ne 0) { throw "install.cmd (commands) exit $LASTEXITCODE" }
          $f = Join-Path $env:RUNNER_TEMP 'pd-cmd2/commands/pds.md'
          if ((Get-FileHash $f).Hash -ne (Get-FileHash 'templates/commands/cursor/pds.md').Hash) { throw 'cmd shim pds.md missing or mismatch' }
          $env:USERPROFILE = Join-Path $env:RUNNER_TEMP 'pd-home7'
          New-Item -ItemType Directory -Force $env:USERPROFILE | Out-Null
          cmd /c "scripts\install.cmd all"
          foreach ($c in '.claude/commands/pds.md', '.codex/prompts/pds.md', '.cursor/commands/pds.md') { if (-not (Test-Path (Join-Path $env:USERPROFILE $c))) { throw "cmd all: missing $c" } }
